name: CI

# Gate every change on a green typecheck, test run and production build.
#
# `pull_request` deliberately has no branch filter: a stacked PR (one whose base
# is another feature branch rather than main) is gated too, and GitHub evaluates
# the workflow from the base+head merge commit, so a workflow added by a PR also
# runs for that PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. This project has no backend, no telemetry, no secrets and no deploy
# step, so no other scope is required — and none should be granted.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Run every Node version even if one fails, so a single run reports the
      # whole compatibility picture.
      fail-fast: false
      matrix:
        # Must match package.json#engines: ^22.12.0 || ^24.0.0 || >=26.0.0
        node: ['22', '24', '26']
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci`, never `npm install`: the committed lockfile is authoritative,
      # so the build fails loudly if it drifts from package.json instead of
      # silently resolving different versions than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
